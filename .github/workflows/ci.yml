name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-cli:
    name: Build CLI (Rust)
    runs-on: ubuntu-latest
    # The target directory layout mirrors the local yarn scripts exactly (see
    # packages/git-span/scripts/cargo-build-system.md): non-codegen tasks
    # (check, clippy) write rmeta into a `check` dir; codegen tasks (nextest,
    # build) write rlib into a `build` dir, per crate. They MUST stay separate —
    # sharing one dir leaves rmeta-only artifacts that fail downstream rlib
    # links with E0463 "can't find crate". CARGO_INCREMENTAL=0 because cold CI
    # builds never recoup the incremental metadata overhead. Runners are not the
    # devcontainer's virtiofs mount, so the single-job compile-graph
    # serialization the shared target root once required there (card main-122,
    # resolved by main-215's relocation to container-native storage) never
    # applied here — the pin existed only for parity, and default job
    # parallelism is now universal policy.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold and clang
        run: sudo apt-get update && sudo apt-get install -y mold clang

      # The [target.*].linker config pins the bare name `cc.mold-wrapper`
      # (worktree-invariant fingerprint; see README "Linker (Linux only)") —
      # it must be on PATH for the raw-cargo steps below. CI does not go
      # through with-target-lock.sh, so the scripted self-heal does not apply.
      - name: Install mold cc wrapper on PATH
        run: sudo install -m 755 packages/git-span/scripts/cc.mold-wrapper.sh /usr/local/bin/cc.mold-wrapper

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/git-span -> ${{ runner.temp }}/git-span-target

      - name: Cargo check (git-span)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/git-span-target/git-span/check
          RUSTFLAGS: "-W unused -W dead-code"
        run: cd packages/git-span && cargo check --quiet --locked

      - name: Cargo clippy (git-span)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/git-span-target/git-span/check
          RUSTFLAGS: "-W unused -W dead-code"
        run: cd packages/git-span && cargo clippy --quiet --locked -- -D warnings

      - name: Cargo test (git-span)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/git-span-target/git-span/build
        run: cd packages/git-span && cargo nextest run --locked

      - name: Cargo clippy (git-span-core)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/git-span-target/git-span-core/check
          RUSTFLAGS: "-W unused -W dead-code"
        run: cd packages/git-span-core && cargo clippy --quiet --locked -- -D warnings

      - name: Cargo test (git-span-core)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/git-span-target/git-span-core/build
        run: cd packages/git-span-core && cargo test --locked

      - name: Cargo build (release)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/git-span-target/git-span/build
        run: cd packages/git-span && cargo build --release --locked

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: git-span-cli
          path: ${{ runner.temp }}/git-span-target/git-span/build/release/git-span
          retention-days: 1

  build-extension:
    name: Build Extension (TypeScript)
    runs-on: ubuntu-latest
    needs: build-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: git-span-cli

      - name: Place CLI binary on PATH
        run: chmod +x git-span && sudo mv git-span /usr/local/bin/

      - name: Check for drifted spans
        run: git span drift

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Lint
        run: cd packages/extension && yarn lint

      - name: Typecheck
        run: cd packages/extension && yarn typecheck

      - name: Test
        run: cd packages/extension && yarn test

      - name: Build
        run: cd packages/extension && yarn build
