[build]
# Per-worktree target directory. Resolves to packages/git-span/target-cache.
# CARGO_TARGET_DIR (set by yarn scripts) overrides this.
target-dir = "target-cache"

[profile.dev]
incremental = true

[profile.test]
incremental = true

# Single test thread: the test suite uses process-wide mutable state (env
# vars, global statics for call counters) that is not safe under concurrent
# test execution.  Running serially eliminates flaky failures from state
# leakage between test threads.
[env]
RUST_TEST_THREADS = "1"

# Linux links run through the mold cc wrapper cc.mold-wrapper.sh, installed to
# PATH by .devcontainer/Dockerfile, self-healed for scripted runs by
# with-target-lock.sh (copied to $HOME/.local/bin on demand), and documented
# in README "Linker (Linux only)". The linker is a BARE NAME, deliberately: Cargo
# 1.97 hashes the *resolved* linker value into every unit fingerprint, so a
# relative-path linker (resolved to a per-worktree absolute path) forces
# full-graph recompiles from sibling worktrees; the bare name hashes the same
# literal from every worktree and the PATH lookup happens at spawn time. The
# [target.*].linker key is deliberately RUSTFLAGS-immune.
[target.x86_64-unknown-linux-gnu]
linker = "cc.mold-wrapper"

[target.aarch64-unknown-linux-gnu]
linker = "cc.mold-wrapper"
