[package]
name = "git-mora"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Git mora command-line utility"
repository = "https://github.com/goodfoot-io/git-span"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.2"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "gen-manpage"
path = "src/bin/gen-manpage.rs"
test = false
bench = false
