<h1>git-mora-topic-exec</h1>
<pre>Run a command with command-scoped topic context

Usage: git mora topic exec [OPTIONS] -- &lt;command&gt;...

Arguments:
  &lt;command&gt;...
          

Options:
      --topic &lt;id&gt;
          

      --no-topics
          Explicitly empty context

  -h, --help
          Print help
</pre>
